[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trocr-pdf-ocr"
version = "0.1.0"
description = "Offline PDF OCR using a bundled, quantized TrOCR ONNX model"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.20,<2",
    "opencv-python-headless>=4.8",
    "Pillow>=10",
    "PyMuPDF>=1.24",
    "transformers>=4.46,<5",
]

[project.scripts]
trocr-pdf-ocr = "trocr_pdf_ocr.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
trocr_pdf_ocr = ["model/*"]